<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a5445" />
      <stop offset="50%" stop-color="#0e6b58" />
      <stop offset="100%" stop-color="#064034" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="4" />

  <!-- Glowing Aura -->
  <circle cx="256" cy="245" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Brain & Lungs Breath Waves (Central Emblem) -->
  <g transform="translate(256, 235) scale(1.15)">
    <!-- Left Lung / Brain Lobe -->
    <path d="M -15,-90 C -70,-90 -125,-40 -125,25 C -125,90 -75,135 -15,140 C -15,100 -25,50 -25,0 C -25,-45 -15,-70 -15,-90 Z" 
          fill="url(#accentGrad)" opacity="0.95" />
    
    <!-- Right Lung / Brain Lobe -->
    <path d="M 15,-90 C 70,-90 125,-40 125,25 C 125,90 75,135 15,140 C 15,100 25,50 25,0 C 25,-45 15,-70 15,-90 Z" 
          fill="url(#accentGrad)" opacity="0.95" />

    <!-- Central Trachea / Neural Stem -->
    <path d="M 0,-120 L 0,10" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M 0,10 C -20,40 -60,65 -80,85" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 0,10 C 20,40 60,65 80,85" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Neural Focus Synapse Nodes -->
    <circle cx="0" cy="-120" r="10" fill="#ffffff" />
    <circle cx="-55" cy="-45" r="8" fill="#ffffff" />
    <circle cx="55" cy="-45" r="8" fill="#ffffff" />
    <circle cx="-80" cy="85" r="9" fill="#ffffff" />
    <circle cx="80" cy="85" r="9" fill="#ffffff" />
    <circle cx="-90" cy="20" r="7" fill="#ffffff" />
    <circle cx="90" cy="20" r="7" fill="#ffffff" />

    <!-- Synapse Bridges -->
    <line x1="-55" y1="-45" x2="-90" y2="20" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="4,4" />
    <line x1="55" y1="-45" x2="90" y2="20" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  <!-- App Brand Text -->
  <text x="256" y="440" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="8">NAPAS</text>
  <text x="256" y="475" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="3">WELLNESS &amp; FOCUS</text>
</svg>
